[project]
name = "demandpilot-api"
version = "0.1.0"
description = "REST API for DemandPilot AI"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi",
    "google-genai>=2.34.0",
    "httpx>=0.28,<1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
