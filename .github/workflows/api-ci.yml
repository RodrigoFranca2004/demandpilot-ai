name: Backend CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint and Test
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: demandpilot_ci
          POSTGRES_PASSWORD: demandpilot_ci
          POSTGRES_DB: demandpilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demandpilot_ci -d demandpilot_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --locked

      - name: Check lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Run tests
        run: uv run --locked pytest -q

      - name: Check PostgreSQL migrations, seed, and dashboard contracts
        env:
          DATABASE_URL: postgresql+psycopg://demandpilot_ci:demandpilot_ci@127.0.0.1:5432/demandpilot_ci
          DATABASE_USE_NULL_POOL: "true"
          RUN_POSTGRES_SMOKE: "1"
        run: |
          uv run --locked alembic upgrade head
          uv run --locked python -m app.demo_data
          uv run --locked pytest -q tests/test_postgres_smoke.py
